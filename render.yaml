# Render blueprint — deploys the FastAPI backend as a free-tier web service.
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: haaris-backend
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: GROQ_API_KEY
        sync: false # set in the Render dashboard — never commit keys
      - key: MONGODB_URL
        sync: false # MongoDB Atlas connection string
      - key: CORS_ORIGINS
        sync: false # comma-separated, e.g. https://haaris.vercel.app
      - key: REPORTS_DIR
        value: /tmp/reports # free tier has ephemeral disk — PDFs are transient
